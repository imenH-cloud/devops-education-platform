global:
  scrape_interval: 15s

scrape_configs:
  # Application Services (8 microservices)
  - job_name: 'user-service'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: user-service
      - source_labels: [__address__]
        action: replace
        regex: (.+)
        target_label: __address__
        replacement: $1:3002

  - job_name: 'auth-service'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: auth-service
      - source_labels: [__address__]
        action: replace
        regex: (.+)
        target_label: __address__
        replacement: $1:3001

  - job_name: 'activity-service'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: activity-service
      - source_labels: [__address__]
        action: replace
        regex: (.+)
        target_label: __address__
        replacement: $1:3003

  - job_name: 'classroom-service'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: classroom-service
      - source_labels: [__address__]
        action: replace
        regex: (.+)
        target_label: __address__
        replacement: $1:3006

  - job_name: 'parent-service'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: parent-service
      - source_labels: [__address__]
        action: replace
        regex: (.+)
        target_label: __address__
        replacement: $1:3004

  - job_name: 'student-service'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: student-service
      - source_labels: [__address__]
        action: replace
        regex: (.+)
        target_label: __address__
        replacement: $1:3005

  - job_name: 'teacher-service'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: teacher-service
      - source_labels: [__address__]
        action: replace
        regex: (.+)
        target_label: __address__
        replacement: $1:3007

  - job_name: 'gateway-backend'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: gateway-backend
      - source_labels: [__address__]
        action: replace
        regex: (.+)
        target_label: __address__
        replacement: $1:3000

  - job_name: 'frontend-app'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: frontend-app
      - source_labels: [__address__]
        action: replace
        regex: (.+)
        target_label: __address__
        replacement: $1:4200

  # Prometheus Self Monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Docker Desktop Kubelet (without auth - simpler)
  - job_name: 'kubelet'
    scheme: http
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __address__
        replacement: $1:10255
