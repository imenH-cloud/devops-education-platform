apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: default
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: default
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: busybox:1.35
          command: ['sh', '-c', "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: migrate
          image: postgres:15-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              psql -h postgres -U postgres -d education -f /docker-entrypoint-initdb.d/init.sql
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: init-sql
          configMap:
            name: db-init-script
            defaultMode: 0777
