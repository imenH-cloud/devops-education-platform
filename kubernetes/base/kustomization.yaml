apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: education

resources:
  - auth-service/deployment.yaml
  - auth-service/service.yaml
  - user-service/deployment.yaml
  - user-service/service.yaml
  - activity-service/deployment.yaml
  - activity-service/service.yaml
  - parent-service/deployment.yaml
  - parent-service/service.yaml
  - student-service/deployment.yaml
  - student-service/service.yaml
  - classroom-service/deployment.yaml
  - classroom-service/service.yaml
  - teacher-service/deployment.yaml
  - teacher-service/service.yaml
  - gateway-service/deployment.yaml
  - gateway-service/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - database/postgres-statefulset.yaml
  - database/postgres-service.yaml
  - redis/deployment.yaml
  - redis/service.yaml
  - rabbitmq/deployment.yaml
  - rabbitmq/service.yaml
  - elasticsearch/deployment.yaml
  - elasticsearch/service.yaml
  - kibana/deployment.yaml
  - kibana/service.yaml
  - prometheus/deployment.yaml
  - prometheus/service.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml

# Common labels applied to all resources
commonLabels:
  app: horizons-tsa
  managed-by: argocd

# Images to update from CI/CD pipeline
images:
  - name: eline2016/devopspfe-auth-service
    newTag: latest
  - name: eline2016/devopspfe-user-service
    newTag: latest
  - name: eline2016/devopspfe-activity-service
    newTag: latest
  - name: eline2016/devopspfe-parent-service
    newTag: latest
  - name: eline2016/devopspfe-student-service
    newTag: latest
  - name: eline2016/devopspfe-classroom-service
    newTag: latest
  - name: eline2016/devopspfe-teacher-service
    newTag: latest
  - name: eline2016/devopspfe-gateway-service
    newTag: latest
  - name: eline2016/devopspfe-frontend-app
    newTag: latest

# Patches for different environments
patchesStrategicMerge:
  - replicas.yaml

# Variables
vars:
  - name: REPLICA_COUNT
    objref:
      kind: Deployment
      name: auth-service-deployment
      apiVersion: apps/v1
    fieldref:
      fieldpath: spec.replicas
