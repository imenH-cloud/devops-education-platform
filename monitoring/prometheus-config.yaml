apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config-simple
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'education-cluster'
        monitor: 'devops-education'

    alerting:
      alertmanagers:
      - static_configs:
        - targets: []

    rule_files:
      - '/etc/prometheus/rules/alerts.yml'

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
        - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: default;kubernetes;https

      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
        - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: 'true'
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)

      - job_name: 'gateway'
        static_configs:
          - targets: ['gateway-backend.education:3000']

      - job_name: 'user-service'
        static_configs:
          - targets: ['user-service.education:3002']

      - job_name: 'auth-service'
        static_configs:
          - targets: ['auth-service.education:3001']

      - job_name: 'activity-service'
        static_configs:
          - targets: ['activity-service.education:3003']

      - job_name: 'classroom-service'
        static_configs:
          - targets: ['classroom-service.education:3006']

      - job_name: 'parent-service'
        static_configs:
          - targets: ['parent-service.education:3004']

      - job_name: 'student-service'
        static_configs:
          - targets: ['student-service.education:3005']

      - job_name: 'teacher-service'
        static_configs:
          - targets: ['teacher-service.education:3007']
