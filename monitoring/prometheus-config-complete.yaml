apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config-updated
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'education-cluster'
        monitor: 'devops-education'

    alerting:
      alertmanagers:
      - static_configs:
        - targets: []

    rule_files:
      - '/etc/prometheus/rules/*.yml'

    scrape_configs:
      # Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # ===== MICROSERVICES (namespace: education) =====
      - job_name: 'gateway'
        metrics_path: '/metrics'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
              - education
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: gateway
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: '$1:3000'

      - job_name: 'auth-service'
        metrics_path: '/metrics'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
              - education
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: auth-service
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: '$1:3001'

      - job_name: 'user-service'
        metrics_path: '/metrics'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
              - education
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: user-service
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: '$1:3002'

      - job_name: 'activity-service'
        metrics_path: '/metrics'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
              - education
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: activity-service
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: '$1:3003'

      - job_name: 'classroom-service'
        metrics_path: '/metrics'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
              - education
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: classroom-service
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: '$1:3006'

      - job_name: 'parent-service'
        metrics_path: '/metrics'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
              - education
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: parent-service
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: '$1:3004'

      - job_name: 'student-service'
        metrics_path: '/metrics'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
              - education
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: student-service
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: '$1:3005'

      - job_name: 'teacher-service'
        metrics_path: '/metrics'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
              - education
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: teacher-service
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: '$1:3007'

      # ===== INFRASTRUCTURE =====
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
        - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: default;kubernetes;https

      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
        - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
        - role: pod
        relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: 'true'
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)

  alerts.yml: |
    groups:
    - name: education-platform
      interval: 30s
      rules:
      # Pod CPU Alert
      - alert: HighPodCPU
        expr: |
          (sum(rate(container_cpu_usage_seconds_total{namespace="education"}[5m])) by (pod_name, namespace) / 
           sum(container_spec_cpu_quota{namespace="education"}) by (pod_name, namespace) * 100) > 80
        for: 2m
        labels:
          severity: warning
          service: education-platform
        annotations:
          summary: "High CPU usage detected on pod {{ $labels.pod_name }}"
          description: "Pod {{ $labels.pod_name }} CPU usage is above 80%: {{ $value }}%"

      # Pod Memory Alert
      - alert: HighPodMemory
        expr: |
          (sum(container_memory_usage_bytes{namespace="education"}) by (pod_name, namespace) / 
           sum(container_spec_memory_limit_bytes{namespace="education"}) by (pod_name, namespace) * 100) > 70
        for: 2m
        labels:
          severity: warning
          service: education-platform
        annotations:
          summary: "High memory usage detected on pod {{ $labels.pod_name }}"
          description: "Pod {{ $labels.pod_name }} memory usage is above 70%: {{ $value }}%"

      # Pod Restarts Alert
      - alert: PodRestarts
        expr: increase(kube_pod_container_status_restarts_total{namespace="education"}[15m]) > 3
        for: 1m
        labels:
          severity: critical
          service: education-platform
        annotations:
          summary: "Pod {{ $labels.pod }} has restarted multiple times"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ $value }} times in 15 minutes"

      # Service Down Alert
      - alert: ServiceDown
        expr: up{job=~"gateway|user-service|auth-service|activity-service|classroom-service|parent-service|student-service|teacher-service"} == 0
        for: 2m
        labels:
          severity: critical
          service: education-platform
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been down for more than 2 minutes"

      # Node Disk Pressure
      - alert: NodeDiskPressure
        expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
        for: 5m
        labels:
          severity: warning
          service: kubernetes
        annotations:
          summary: "Node {{ $labels.node }} has disk pressure"
          description: "Node {{ $labels.node }} is experiencing disk pressure"
