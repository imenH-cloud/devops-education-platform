apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.auth.username }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database }}
  DATABASE_URL: postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@postgres:5432/{{ .Values.postgresql.auth.database }}
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  NODE_ENV: {{ .Values.environment }}
  JWT_SECRET: "change-me-in-production"
  API_KEY: "change-me-in-production"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: {{ .Release.Namespace }}
data:
  LOG_LEVEL: "info"
  LOG_FORMAT: "{{ .Values.logging.type }}"
  PROMETHEUS_ENABLED: "true"
  ENVIRONMENT: "{{ .Values.environment }}"
