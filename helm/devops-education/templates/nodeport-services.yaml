apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-nodeport
  namespace: {{ .Release.Namespace }}
  labels:
    app: rabbitmq
spec:
  type: NodePort
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
    nodePort: 30672
    protocol: TCP
  - name: management
    port: 15672
    targetPort: 15672
    nodePort: 30015
    protocol: TCP
  selector:
    app: rabbitmq

