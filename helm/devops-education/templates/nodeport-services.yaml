apiVersion: v1
kind: Service
metadata:
  name: postgres-nodeport
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres
spec:
  type: NodePort
  ports:
  - port: 5432
    targetPort: 5432
    nodePort: 30432
    protocol: TCP
  selector:
    app: postgres

