apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-datasources-fixed
  namespace: monitoring
data:
  prometheus-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 15s
        basicAuth: false
