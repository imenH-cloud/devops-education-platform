apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        monitor: 'education-platform'

    rule_files:
      - /etc/prometheus/alerts.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    scrape_configs:
      # Prometheus self-monitoring (ONLY THIS WORKS)
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Grafana metrics
      - job_name: 'grafana'
        static_configs:
          - targets: ['grafana:3000']

  alerts.yml: |
    groups:
      - name: education_platform
        interval: 30s
        rules: []
