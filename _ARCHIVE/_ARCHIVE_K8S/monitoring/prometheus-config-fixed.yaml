apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        monitor: 'education-platform-monitor'

    # Alerting rules
    rule_files:
      - /etc/prometheus/alerts.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Kubernetes Nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - source_labels: [__address__]
            regex: ([^:]+)(?::\d+)?
            replacement: ${1}:10250
            target_label: __address__

      # Kubernetes Services via annotations
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: service
        metrics_path: /probe
        params:
          module: [http_2xx]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_probe]
            action: keep
            regex: 'true'
          - source_labels: [__address__]
            target_label: __param_target
          - target_label: __address__
            replacement: blackbox-exporter:9115
          - source_labels: [__param_target]
            target_label: instance
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)

      # Education Namespace - via Kubelet metrics
      - job_name: 'education-cluster'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - education
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: 'metrics|prometheus'
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      # Monitoring namespace metrics
      - job_name: 'monitoring-stack'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - monitoring
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: 'prometheus|grafana'
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: 'metrics'
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

  alerts.yml: |
    groups:
      - name: education_platform
        interval: 30s
        rules:
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total{namespace="education"}[1h]) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} in education namespace is crash looping"

          - alert: PodNotReady
            expr: min_over_time(sum by (namespace, pod) (kube_pod_status_phase{namespace="education", phase=~"Pending|Unknown|Failed"})[15m:1m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} in education namespace is not ready"

          - alert: HighMemoryUsage
            expr: (sum(container_memory_usage_bytes{namespace="education"}) by (pod) / sum(container_spec_memory_limit_bytes{namespace="education"}) by (pod)) > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} has high memory usage"

          - alert: PodDiskSpaceRunningOut
            expr: (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.8
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod disk space running out on {{ $labels.persistentvolumeclaim }}"
