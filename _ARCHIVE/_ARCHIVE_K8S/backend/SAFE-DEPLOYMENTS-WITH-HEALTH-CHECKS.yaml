# Kubernetes Deployment Templates with Health Checks & Init Containers
# These are READY-TO-USE - just update image tags and apply

---
# AUTH SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-deployment
  namespace: education
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
      - name: db-init
        image: eline2016/devopspfe-auth-service:58
        command: ['npm', 'run', 'migration:run']
        env:
        - name: DB_HOST
          value: "postgres-deployment"
        - name: DB_PORT
          value: "5432"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: DB_NAME
          value: "education"

      containers:
      - name: auth-service
        image: eline2016/devopspfe-auth-service:58
        ports:
        - containerPort: 3001
        env:
        - name: DB_HOST
          value: "postgres-deployment"
        - name: DB_PORT
          value: "5432"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: DB_NAME
          value: "education"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"

        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 45
          periodSeconds: 15
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 0
          periodSeconds: 5
          failureThreshold: 30

