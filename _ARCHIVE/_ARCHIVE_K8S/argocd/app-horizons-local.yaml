apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: horizons-education
  namespace: argocd-clean
spec:
  project: default
  source:
    path: kubernetes/base
    repoURL: file:///manifests
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: education
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
