apiVersion: v1
kind: Service
metadata:
  name: argocd-server-nodeport
  namespace: argocd-new
  labels:
    app.kubernetes.io/name: argocd-server-nodeport
spec:
  type: NodePort
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
    nodePort: 31380
  - name: https
    port: 443
    targetPort: 8080
    protocol: TCP
    nodePort: 31443
  selector:
    app.kubernetes.io/name: argocd-server
