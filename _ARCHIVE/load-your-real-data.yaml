          SELECT 'DÉTAIL - STUDENTS:' AS detail;
          SELECT "firstName" || ' ' || "lastName", email FROM student;
          
          SELECT 'DÉTAIL - ACTIVITIES:' AS detail;
          SELECT name, type, location, duration FROM activity;
          EOF
      restartPolicy: Never
  backoffLimit: 3
