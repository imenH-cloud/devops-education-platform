          (2, 'chadha', 'khaldi', 'chadha1@gmail.com', '90878654', '7654567', 'chebbia tozeur', 'CNRPS', '1723456', 'enseignante'),
          (3, 'ALI', 'BELDI', 'alibeldi@gmail.com', '20654234', '7345623', 'ras tabya tozeu', 'CNSS', '172345', 'COMMERCANT'),
          (4, 'zahra', 'kaddouri', 'zahra@gmail.com', '0', '8453423', 'Degache', 'CNRPS', '0', 'femme de menage');
          
          -- CLASSROOMS
          INSERT INTO classroom (id, name, capacity, grade, "academicYear", location, "Specialization") 
          VALUES 
          (1, 'Class A', 15, 'L1', '2024-2025', 'Building A', 'Autisme'),
          (2, 'Class B', 16, 'L2', '2024-2025', 'Building B', 'Autisme'),
          (3, 'Class C', 18, 'L3', '2024-2025', 'Building C', 'Autisme');
          
