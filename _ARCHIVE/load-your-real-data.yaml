          (5, 'Mohamed', 'S002', 'yazid jhimi', 'yazid@gmail.com', '2016-05-15', '23098335', 'Tozeur', '2024-09-01', 2, 2),
          (6, 'yassine', 'S003', 'beldi', 'yassine@gmail.com', '2014-03-22', '20345654', 'Tozeur', '2024-09-01', 3, 2),
          (7, 'abderrazak', 'S004', 'mahmoudi', 'abdou@gmail.com', '2013-11-10', '0', 'unknown', '2024-09-01', 4, 3);
          
          -- ACTIVITIES (vos vraies activités)
          INSERT INTO activity (id, name, type, description, location, date, duration, "isCompleted", "classroomId") 
