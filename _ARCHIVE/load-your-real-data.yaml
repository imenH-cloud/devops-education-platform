apiVersion: batch/v1
kind: Job
metadata:
  name: load-your-real-data
  namespace: education
spec:
  template:
    spec:
      containers:
      - name: psql
        image: postgres:15
        env:
        - name: PGPASSWORD
          value: "postgres"
        command:
        - /bin/sh
        - -c
        - |
          psql -h postgres-service -U postgres -d education <<'EOF'
          -- Nettoyer
          TRUNCATE TABLE activity CASCADE;
          TRUNCATE TABLE student CASCADE;
          TRUNCATE TABLE classroom CASCADE;
          TRUNCATE TABLE parent CASCADE;
          TRUNCATE TABLE teacher CASCADE;
          TRUNCATE TABLE users CASCADE;
          
          -- TEACHERS (vos vrais enseignants)
          INSERT INTO teacher (id, "indexNumber", cin, "firstName", surname, gender, address, telephone, email, specialization, "dateOfMandate") 
          VALUES 
          (1, 'IH001', '09876543', 'IMEN', 'HAMADA', 'F', 'Tozeur', '90545343', 'admin@school.com', 'DIRECTRICE', NOW()),
          (2, 'AZ001', '09876543', 'aziza', 'zayer', 'F', 'Tozeur', '50987654', 'aziza@gmail.com', 'Education spécialisé', NOW()),
          (3, 'SS001', '09876543', 'safwa', 'salem', 'F', 'unknown', '9823456', 'safwa@school.com', 'GESTIONNAIRE', NOW());
          
