# Development environment values
environment: development

replicaCount: 1

postgresql:
  enabled: true
  auth:
    username: postgres
    password: devpassword
    database: education_dev
  primary:
    persistence:
      enabled: false
  resources:
    limits:
      memory: "256Mi"
      cpu: "250m"
    requests:
      memory: "128Mi"
      cpu: "100m"

gateway:
  replicaCount: 1
  resources:
    limits:
      memory: "256Mi"
      cpu: "250m"
    requests:
      memory: "128Mi"
      cpu: "100m"

services:
  - name: user-service
    replicaCount: 1
  - name: auth-service
    replicaCount: 1
  - name: activity-service
    replicaCount: 1
  - name: classroom-service
    replicaCount: 1
  - name: parent-service
    replicaCount: 1
  - name: student-service
    replicaCount: 1
  - name: teacher-service
    replicaCount: 1

frontend:
  replicaCount: 1

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: api-dev.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

prometheus:
  enabled: false

logging:
  enabled: true
  type: "text"
