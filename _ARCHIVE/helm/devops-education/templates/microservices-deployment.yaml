{{- range .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devops-education.fullname" $ }}-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "devops-education.labels" $ | nindent 4 }}
    service: {{ .name }}
spec:
  replicas: {{ .replicaCount }}
  selector:
    matchLabels:
      {{- include "devops-education.selectorLabels" $ | nindent 6 }}
      service: {{ .name }}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .port }}"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "devops-education.selectorLabels" $ | nindent 8 }}
        service: {{ .name }}
    spec:
      serviceAccountName: default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: {{ .name }}
        image: "{{ .image }}:latest"
        imagePullPolicy: {{ $.Values.imagePullPolicy }}
        ports:
        - name: http
          containerPort: {{ .port }}
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: NODE_ENV
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: POSTGRES_DB
        envFrom:
        - configMapRef:
            name: app-config
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "devops-education.labels" $ | nindent 4 }}
    service: {{ .name }}
spec:
  type: ClusterIP
  ports:
  - port: {{ .port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "devops-education.selectorLabels" $ | nindent 4 }}
    service: {{ .name }}
---
{{- end }}
