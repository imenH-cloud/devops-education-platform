apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: monitoring
data:
  alerts.yml: |
    groups:
    - name: education-platform
      interval: 30s
      rules:
      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total{namespace="education"}[15m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} is crash looping"
          description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is restarting frequently"

      - alert: ServiceDown
        expr: up{job=~"gateway|user-service|auth-service|activity-service|classroom-service|parent-service|student-service|teacher-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} is not responding"

      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes{namespace="education"} / container_spec_memory_limit_bytes{namespace="education"} > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.pod_name }}"
          description: "Pod {{ $labels.pod_name }} is using more than 80% of its memory limit"

      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{namespace="education"}[5m]) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.pod_name }}"
          description: "Pod {{ $labels.pod_name }} is using high CPU"

      - alert: PersistentVolumeUsageHigh
        expr: kubelet_volume_stats_used_bytes{namespace="education"} / kubelet_volume_stats_capacity_bytes{namespace="education"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PersistentVolume usage is high on {{ $labels.persistentvolumeclaim }}"
          description: "PersistentVolume {{ $labels.persistentvolumeclaim }} is more than 80% full"
