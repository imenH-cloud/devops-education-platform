apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        monitor: 'devops-education-monitor'

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'gateway'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['gateway-backend.education:3000']

      - job_name: 'user-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['user-service.education:3002']

      - job_name: 'auth-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['auth-service.education:3001']

      - job_name: 'activity-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['activity-service.education:3003']

      - job_name: 'classroom-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['classroom-service.education:3006']

      - job_name: 'parent-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['parent-service.education:3004']

      - job_name: 'student-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['student-service.education:3005']

      - job_name: 'teacher-service'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['teacher-service.education:3007']

      - job_name: 'elasticsearch'
        static_configs:
          - targets: ['elasticsearch.logging:9200']

      - job_name: 'redis'
        static_configs:
          - targets: ['redis.cache:6379']
