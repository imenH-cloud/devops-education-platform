apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-deployment
  namespace: education
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        tier: backend
    spec:
      containers:
      - name: auth-service
        image: eline2016/devopspfe-auth-service:v3
        ports:
        - containerPort: 3001
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: database-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: database-config
              key: DB_PORT
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: DB_NAME
          value: education
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: education
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        tier: backend
    spec:
      containers:
      - name: gateway
        image: eline2016/devopspfe-gateway-service:v6
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: NODE_ENV
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: LOG_LEVEL
        - name: CORS_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: CORS_ORIGIN
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: database-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: database-config
              key: DB_PORT
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: DB_NAME
          value: education
        - name: USER_SERVICE_HOST
          value: user-service
        - name: USER_SERVICE_PORT
          value: "3002"
        - name: AUTH_SERVICE_HOST
          value: auth-service
        - name: AUTH_SERVICE_PORT
          value: "3001"
        - name: ACTIVITY_SERVICE_HOST
          value: activity-service
        - name: ACTIVITY_SERVICE_PORT
          value: "3003"
        - name: PARENT_SERVICE_HOST
          value: parent-service
        - name: PARENT_SERVICE_PORT
          value: "3004"
        - name: STUDENT_SERVICE_HOST
          value: student-service
        - name: STUDENT_SERVICE_PORT
          value: "3005"
        - name: CLASSROOM_SERVICE_HOST
          value: classroom-service
        - name: CLASSROOM_SERVICE_PORT
          value: "3006"
        - name: TEACHER_SERVICE_HOST
          value: teacher-service
        - name: TEACHER_SERVICE_PORT
          value: "3007"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
