global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'education-platform'
    environment: 'production'

rule_files:
  - '/etc/prometheus/rules/alerts.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Education Services - Using Kubernetes DNS (namespace.svc.cluster.local)
  - job_name: 'education-services'
    static_configs:
      - targets:
          - 'gateway-backend.education.svc.cluster.local:3000'
          - 'auth-service.education.svc.cluster.local:3001'
          - 'user-service.education.svc.cluster.local:3002'
          - 'activity-service.education.svc.cluster.local:3003'
          - 'parent-service.education.svc.cluster.local:3004'
          - 'student-service.education.svc.cluster.local:3005'
          - 'classroom-service.education.svc.cluster.local:3006'
          - 'teacher-service.education.svc.cluster.local:3007'
    metrics_path: '/metrics'
    scheme: 'http'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
