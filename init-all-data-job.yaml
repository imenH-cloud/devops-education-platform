          -- VERIFY
          SELECT 'Teachers:' as entity, COUNT(*) FROM teacher
          UNION ALL SELECT 'Parents:', COUNT(*) FROM parent
          UNION ALL SELECT 'Classrooms:', COUNT(*) FROM classroom
          UNION ALL SELECT 'Students:', COUNT(*) FROM student
          UNION ALL SELECT 'Activities:', COUNT(*) FROM activity;
