<div class="container mx-auto px-4 py-8">
  <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-lg overflow-hidden">
    <div class="bg-teal-600 text-white px-6 py-4 flex justify-between items-center">
      <h2 class="text-xl font-bold flex items-center">
        <span class="mr-2">👤</span>Ajouter un Enseignant
      </h2>
      <button (click)="goBack()" class="hover:text-gray-200 text-2xl">&times;</button>
    </div>

    <form [formGroup]="teacherForm" (ngSubmit)="onSubmit()" class="p-6 space-y-6">
      
      <!-- Informations Personnelles -->
      <div class="border-b pb-4">
        <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
          <span class="text-teal-600 mr-2">👤</span>Informations Personnelles
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-gray-700 font-semibold mb-2">Prénom <span class="text-red-500">*</span></label>
            <input type="text" formControlName="firstName" placeholder="Mohamed"
                   class="w-full border px-4 py-2 rounded" />
          </div>

          <div>
            <label class="block text-gray-700 font-semibold mb-2">Nom <span class="text-red-500">*</span></label>
            <input type="text" formControlName="surname" placeholder="Boutheina"
                   class="w-full border px-4 py-2 rounded" />
          </div>

          <div>
            <label class="block text-gray-700 font-semibold mb-2">Sexe <span class="text-red-500">*</span></label>
            <select formControlName="gender" class="w-full border px-4 py-2 rounded">
              <option value="">-- Sélectionnez --</option>
              <option value="Homme">Homme</option>
              <option value="Femme">Femme</option>
            </select>
          </div>

          <div>
            <label class="block text-gray-700 font-semibold mb-2">Date de Naissance</label>
            <input type="date" class="w-full border px-4 py-2 rounded" />
          </div>
        </div>
      </div>

      <!-- Informations Professionnelles -->
      <div class="border-b pb-4">
        <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
          <span class="text-teal-600 mr-2">💼</span>Informations Professionnelles
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-gray-700 font-semibold mb-2">CIN <span class="text-red-500">*</span></label>
            <input type="text" formControlName="cin" placeholder="12345678"
                   class="w-full border px-4 py-2 rounded" />
          </div>

          <div>
            <label class="block text-gray-700 font-semibold mb-2">Matricule <span class="text-red-500">*</span></label>
            <input type="text" formControlName="indexNumber" placeholder="MAT2024001"
                   class="w-full border px-4 py-2 rounded" />
          </div>

          <div class="col-span-2">
            <label class="block text-gray-700 font-semibold mb-2">Spécialité <span class="text-red-500">*</span></label>
            <input type="text" formControlName="specialization" placeholder="Psychologie / Éducation Spécialisée"
                   class="w-full border px-4 py-2 rounded" />
          </div>

          <div>
            <label class="block text-gray-700 font-semibold mb-2">Date de Prise de Fonction <span class="text-red-500">*</span></label>
            <input type="date" formControlName="dateOfMandate"
                   class="w-full border px-4 py-2 rounded" />
          </div>
        </div>
      </div>

      <!-- Informations de Contact -->
      <div class="border-b pb-4">
        <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
          <span class="text-teal-600 mr-2">📧</span>Informations de Contact
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="col-span-2">
            <label class="block text-gray-700 font-semibold mb-2">Email <span class="text-red-500">*</span></label>
            <input type="email" formControlName="email" placeholder="admin@school.com"
                   class="w-full border px-4 py-2 rounded" />
          </div>

          <div>
            <label class="block text-gray-700 font-semibold mb-2">Téléphone <span class="text-red-500">*</span></label>
            <input type="text" formControlName="telephone" placeholder="98765432"
                   class="w-full border px-4 py-2 rounded" />
          </div>

          <div>
            <label class="block text-gray-700 font-semibold mb-2">Adresse <span class="text-red-500">*</span></label>
            <textarea formControlName="address" placeholder="123 Rue de la Paix"
                      class="w-full border px-4 py-2 rounded"></textarea>
          </div>
        </div>
      </div>

      <!-- Accès -->
      <div class="border-b pb-4">
        <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
          <span class="text-teal-600 mr-2">🔐</span>Accès
        </h3>
        <div>
          <label class="block text-gray-700 font-semibold mb-2">Mot de passe <span class="text-red-500">*</span></label>
          <input type="password" formControlName="password"
                 class="w-full border px-4 py-2 rounded" />
          <p class="text-sm text-gray-500 mt-1">Minimum 6 caractères</p>
        </div>
      </div>

      <!-- Réseaux Sociaux (Optionnel) -->
      <div class="border-b pb-4">
        <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
          <span class="text-teal-600 mr-2">🌐</span>Réseaux Sociaux (Optionnel)
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-gray-700 font-semibold mb-2">Facebook</label>
            <input type="text" formControlName="facebook" placeholder="https://facebook.com/..."
                   class="w-full border px-4 py-2 rounded" />
          </div>

          <div>
            <label class="block text-gray-700 font-semibold mb-2">Instagram</label>
            <input type="text" formControlName="instagram" placeholder="https://instagram.com/..."
                   class="w-full border px-4 py-2 rounded" />
          </div>

          <div class="col-span-2">
            <label class="block text-gray-700 font-semibold mb-2">LinkedIn</label>
            <input type="text" formControlName="linkedin" placeholder="https://linkedin.com/in/..."
                   class="w-full border px-4 py-2 rounded" />
          </div>
        </div>
      </div>

      <!-- Photo de Profil -->
      <div class="border-b pb-4">
        <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center">
          <span class="text-teal-600 mr-2">📸</span>Photo de Profil
        </h3>
        <div>
          <label class="block text-gray-700 font-semibold mb-2">Photo de Profil (URL)</label>
          <input type="text" formControlName="profileImage" placeholder="https://example.com/image.jpg"
                 class="w-full border px-4 py-2 rounded" />
          <p class="text-sm text-gray-500 mt-1">Collez l'URL d'une photo de profil</p>
        </div>
      </div>

      <!-- Buttons -->
      <div class="flex justify-end space-x-4 pt-4">
        <button type="button" (click)="goBack()"
                class="px-6 py-2 border border-gray-400 rounded hover:bg-gray-100">Annuler</button>
        <button type="submit" [disabled]="teacherForm.invalid"
                class="px-6 py-2 bg-teal-600 text-white rounded hover:bg-teal-700 disabled:opacity-50 disabled:cursor-not-allowed">Enregistrer l'Enseignant</button>
      </div>
    </form>
  </div>
</div>
