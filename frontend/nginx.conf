worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript;

    upstream auth_backend {
        server auth-service:3001;
    }

    upstream user_backend {
        server user-service:3002;
    }

    upstream activity_backend {
        server activity-service:3003;
    }

    upstream parent_backend {
        server parent-service:3004;
    }

    upstream student_backend {
        server student-service:3005;
    }

    upstream classroom_backend {
        server classroom-service:3006;
    }

    upstream teacher_backend {
        server teacher-service:3007;
    }

    server {
        listen 4200 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ============================================
        # API PROXIES - MUST COME BEFORE SPA ROUTING
        # ============================================

        location ~ ^/auth(/|$) {
            proxy_pass http://auth_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/user(/|$) {
            proxy_pass http://user_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/activity(/|$) {
            proxy_pass http://activity_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/parent(/|$) {
            proxy_pass http://parent_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/student(/|$) {
            proxy_pass http://student_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/classroom(/|$) {
            proxy_pass http://classroom_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/teacher(/|$) {
            proxy_pass http://teacher_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ============================================
        # STATIC FILES
        # ============================================

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ============================================
        # SPA ROUTING - AFTER EVERYTHING ELSE
        # ============================================

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}