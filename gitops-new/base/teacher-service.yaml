apiVersion: apps/v1
kind: Deployment
metadata:
  name: teacher-service-deployment
  labels:
    app: teacher-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teacher-service
  template:
    metadata:
      labels:
        app: teacher-service
    spec:
      containers:
        - name: teacher-service
          image: devopspfe-teacher-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3007
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              value: postgres
            - name: DB_NAME
              value: education
---
apiVersion: v1
kind: Service
metadata:
  name: teacher-service
  labels:
    app: teacher-service
spec:
  selector:
    app: teacher-service
  ports:
    - protocol: TCP
      port: 3007
      targetPort: 3007
  type: ClusterIP
