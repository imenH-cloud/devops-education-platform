apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-backend-deployment
  labels:
    app: gateway-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-backend
  template:
    metadata:
      labels:
        app: gateway-backend
    spec:
      containers:
        - name: gateway-backend
          image: devopspfe-gateway-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: USER_SERVICE_HOST
              value: "user-service"
            - name: USER_SERVICE_PORT
              value: "3002"
            - name: AUTH_SERVICE_HOST
              value: "auth-service"
            - name: AUTH_SERVICE_PORT
              value: "3001"
            - name: ACTIVITY_SERVICE_HOST
              value: "activity-service"
            - name: ACTIVITY_SERVICE_PORT
              value: "3003"
            - name: PARENT_SERVICE_HOST
              value: "parent-service"
            - name: PARENT_SERVICE_PORT
              value: "3004"
            - name: STUDENT_SERVICE_HOST
              value: "student-service"
            - name: STUDENT_SERVICE_PORT
              value: "3005"
            - name: CLASSROOM_SERVICE_HOST
              value: "classroom-service"
            - name: CLASSROOM_SERVICE_PORT
              value: "3006"
            - name: TEACHER_SERVICE_HOST
              value: "teacher-service"
            - name: TEACHER_SERVICE_PORT
              value: "3007"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-backend
  labels:
    app: gateway-backend
spec:
  selector:
    app: gateway-backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
